<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaTask Pro | Gestión de Tareas con Tiempo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #2563eb; --primary-dark: #1e40af; --secondary: #64748b;
            --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
            --background: #f8fafc; --surface: #ffffff; --text-main: #0f172a;
            --text-muted: #64748b; --border: #e2e8f0; --radius: 12px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        [data-theme="dark"] {
            --background: #0f172a; --surface: #1e293b; --text-main: #f1f5f9;
            --text-muted: #94a3b8; --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--background); color: var(--text-main); transition: 0.3s; }
        
        #auth-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #0f172a; display: flex; align-items: center; justify-content: center; z-index: 10000;
        }
        .auth-card {
            background: white; padding: 2rem; border-radius: 16px; width: 90%; max-width: 400px;
            text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .google-btn {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%; padding: 0.75rem; border: 1px solid #e2e8f0; border-radius: 8px;
            background: white; color: #0f172a; font-weight: 600; cursor: pointer; margin-bottom: 1rem;
        }
        .auth-input { width: 100%; padding: 0.75rem; margin-bottom: 0.75rem; border: 1px solid #e2e8f0; border-radius: 8px; }

        .layout { max-width: 1200px; margin: 0 auto; padding: 2rem 1rem; display: none; }
        .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card { background: var(--surface); padding: 1.5rem; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); }
        .stat-card h4 { color: var(--text-muted); font-size: 0.875rem; text-transform: uppercase; }
        .stat-card p { font-size: 1.875rem; font-weight: 700; color: var(--primary); }
        .control-panel { display: grid; grid-template-columns: 1fr 300px; gap: 2rem; }
        @media (max-width: 850px) { .control-panel { grid-template-columns: 1fr; } }
        .card { background: var(--surface); padding: 1.5rem; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 1.5rem; }
        input, select, textarea { width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px; background: var(--background); color: var(--text-main); margin-top: 5px; }
        .btn { padding: 0.75rem 1.5rem; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; justify-content: center; width: 100%; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .task-item { background: var(--surface); padding: 1.25rem; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 0.75rem; display: flex; justify-content: space-between; align-items: center; }
        .priority-pill { padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
        .p-Alta { background: #fee2e2; color: #991b1b; }
        .p-Media { background: #fef3c7; color: #92400e; }
        .p-Baja { background: #dcfce7; color: #166534; }
        #excel-upload { display: none; }
        #pdf-template { display: none; padding: 40px; }

        @media (max-width: 768px) {
            .layout { padding: 1rem; }
            .app-header { flex-direction: column; align-items: flex-start; gap: 1.25rem; }
            .app-header div:last-child { width: 100%; display: grid !important; grid-template-columns: 60px 1fr 1fr; gap: 10px; }
            .stats-grid { grid-template-columns: 1fr; gap: 0.75rem; }
            .control-panel { display: flex; flex-direction: column-reverse; gap: 1.5rem; }
            .task-item { flex-direction: column; align-items: flex-start; gap: 1rem; }
            .task-item div:last-child { width: 100%; display: flex; justify-content: stretch; border-top: 1px solid var(--border); padding-top: 0.75rem; }
        }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="auth-card">
        <h2 style="margin-bottom: 1rem; font-weight: 800;">PharmaTask <span style="color: var(--primary);">Pro</span></h2>
        <button class="google-btn" onclick="Auth.loginGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="Google">
            Entrar con Google
        </button>
        <div style="margin: 1rem 0; color: #64748b; font-size: 0.8rem;">o acceso por correo</div>
        <input type="email" id="email" class="auth-input" placeholder="Correo">
        <input type="password" id="pass" class="auth-input" placeholder="Contraseña">
        <button class="btn btn-primary" onclick="Auth.loginEmail()">Entrar</button>
    </div>
</div>

<div class="layout" id="main-layout">
    <header class="app-header">
        <div>
            <h1 style="font-size: 1.5rem; font-weight: 800;">PharmaTask <span style="color: var(--primary);">Pro</span></h1>
            <p style="color: var(--text-muted); font-size: 0.875rem;">Gestión de Tareas y Tiempos</p>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-outline" style="width: auto;" onclick="App.toggleTheme()">🌓</button>
            <button class="btn btn-primary" style="width: auto;" onclick="UI.openModal()">+ Nueva Tarea</button>
            <button class="btn btn-outline" style="width: auto;" onclick="Auth.logout()">Salir</button>
        </div>
    </header>

    <div class="stats-grid">
        <div class="stat-card"><h4>Total</h4><p id="stat-total">0</p></div>
        <div class="stat-card"><h4>En Proceso</h4><p id="stat-process" style="color: var(--warning);">0</p></div>
        <div class="stat-card"><h4>Finalizadas</h4><p id="stat-done" style="color: var(--success);">0</p></div>
    </div>

    <main class="control-panel">
        <section>
            <input type="text" id="globalSearch" placeholder="Buscar farmacia o código..." onkeyup="App.filterTasks()" style="margin-bottom: 1.5rem;">
            <div id="taskListContent"></div>
        </section>

        <aside>
            <div class="card">
                <h3 style="font-size: 1rem;">Base de Datos</h3>
                <input type="file" id="excel-upload" accept=".xlsx, .xls, .csv" onchange="App.handleExcel(event)">
                <button class="btn btn-outline" onclick="document.getElementById('excel-upload').click()" style="margin-top:10px;">📁 Cargar Farmacias</button>
                <div id="client-status" style="font-size: 0.75rem; text-align: center; margin-top: 10px;"></div>
            </div>
            <button class="btn btn-primary" onclick="App.exportPDF()">📄 Reporte de Tiempos</button>
        </aside>
    </main>
</div>

<!-- Template oculto para PDF -->
<div id="pdf-template">
    <h2 style="color: #2563eb; border-bottom: 2px solid #2563eb; padding-bottom: 10px;">Reporte de Productividad - PharmaTask</h2>
    <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
        <thead>
            <tr style="background: #f1f5f9;">
                <th style="padding: 10px; border: 1px solid #ddd;">Cod</th>
                <th style="padding: 10px; border: 1px solid #ddd;">Farmacia</th>
                <th style="padding: 10px; border: 1px solid #ddd;">Descripción</th>
                <th style="padding: 10px; border: 1px solid #ddd;">Inicio</th>
                <th style="padding: 10px; border: 1px solid #ddd;">Finalización</th>
            </tr>
        </thead>
        <tbody id="pdf-body"></tbody>
    </table>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCCPwgkILNrFt08pSJMxxH1W9Bc18JWBFE",
        authDomain: "pharma-task.firebaseapp.com",
        projectId: "pharma-task",
        storageBucket: "pharma-task.firebasestorage.app",
        messagingSenderId: "157821568633",
        appId: "1:157821568633:web:be0aa1626322119a1af6a8"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.Auth = {
        loginGoogle: () => signInWithPopup(auth, new GoogleAuthProvider()),
        loginEmail: () => signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('pass').value),
        logout: () => signOut(auth)
    };

    onAuthStateChanged(auth, (user) => {
        document.getElementById('auth-screen').style.display = user ? 'none' : 'flex';
        document.getElementById('main-layout').style.display = user ? 'block' : 'none';
        if(user) App.init();
    });
</script>

<script>
    const App = {
        tasks: JSON.parse(localStorage.getItem('pharma_tasks')) || [],
        clients: JSON.parse(localStorage.getItem('pharma_db_clients')) || [],
        
        init() { this.updateStats(); this.renderAll(); this.updateClientUI(); },
        save() { localStorage.setItem('pharma_tasks', JSON.stringify(this.tasks)); this.updateStats(); this.renderAll(); },

        handleExcel(event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                const data = new Uint8Array(e.target.result);
                const wb = XLSX.read(data, { type: 'array' });
                const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                this.clients = json.map(r => ({
                    id: (r["Codigo"] || r["ID"] || "").toString(),
                    name: (r["NombreFantasia"] || r["Nombre"] || "").toString()
                })).filter(c => c.id && c.name);
                localStorage.setItem('pharma_db_clients', JSON.stringify(this.clients));
                this.updateClientUI();
                Swal.fire('Éxito', 'Farmacias cargadas correctamente', 'success');
            };
            reader.readAsArrayBuffer(file);
        },

        updateClientUI() {
            const s = document.getElementById('client-status');
            s.innerText = this.clients.length > 0 ? `✅ ${this.clients.length} farmacias` : '❌ Sin base';
            s.style.color = this.clients.length > 0 ? 'var(--success)' : 'var(--danger)';
        },

        autoComplete(val, src) {
            const found = this.clients.find(c => src === 'id' ? c.id === val : c.name.toLowerCase().includes(val.toLowerCase()));
            if(found) {
                document.getElementById('swal-client').value = found.id;
                document.getElementById('swal-pharmacy').value = found.name;
            }
        },

        addTask(data) {
            this.tasks.unshift({ 
                id: Date.now(), 
                status: 'pendiente', 
                createdAt: data.customTime || new Date().toLocaleString('es-AR'), // Captura hora del modal
                completedAt: null,
                ...data 
            });
            this.save();
        },

        updateStatus(id, stat) {
            const t = this.tasks.find(x => x.id === id);
            if(t) {
                t.status = stat;
                if(stat === 'completada') t.completedAt = new Date().toLocaleString('es-AR'); // Registro de fin automático
                this.save();
            }
        },

        deleteTask(id) { this.tasks = this.tasks.filter(t => t.id !== id); this.save(); },
        updateStats() {
            document.getElementById('stat-total').innerText = this.tasks.length;
            document.getElementById('stat-process').innerText = this.tasks.filter(t => t.status === 'proceso').length;
            document.getElementById('stat-done').innerText = this.tasks.filter(t => t.status === 'completada').length;
        },

        filterTasks() {
            const q = document.getElementById('globalSearch').value.toLowerCase();
            UI.drawList(this.tasks.filter(t => t.pharmacy.toLowerCase().includes(q) || t.clientId.includes(q)));
        },

        renderAll() { UI.drawList(this.tasks); },
        toggleTheme() { document.body.setAttribute('data-theme', document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); },

        async exportPDF() {
            const done = this.tasks.filter(t => t.status === 'completada');
            if(done.length === 0) return Swal.fire('Aviso', 'No hay tareas completadas para reportar.', 'info');
            
            document.getElementById('pdf-body').innerHTML = done.map(t => `
                <tr>
                    <td style="padding:8px;border:1px solid #ddd">${t.clientId}</td>
                    <td style="padding:8px;border:1px solid #ddd">${t.pharmacy}</td>
                    <td style="padding:8px;border:1px solid #ddd">${t.desc}</td>
                    <td style="padding:8px;border:1px solid #ddd; font-size:0.75rem">${t.createdAt}</td>
                    <td style="padding:8px;border:1px solid #ddd; font-size:0.75rem">${t.completedAt}</td>
                </tr>`).join('');

            const el = document.getElementById('pdf-template');
            el.style.display = 'block';
            await html2pdf().set({ 
                margin: 10, 
                filename: `Reporte_${new Date().toLocaleDateString()}.pdf`,
                jsPDF: { orientation: 'landscape' }
            }).from(el).save();
            el.style.display = 'none';
        }
    };

    const UI = {
        drawList(tasks) {
            const container = document.getElementById('taskListContent');
            container.innerHTML = tasks.length === 0 ? `<div style="text-align:center;color:var(--text-muted);padding:2rem;">No hay tareas que mostrar</div>` :
            tasks.map(t => `
                <div class="task-item" style="${t.status === 'completada' ? 'opacity:0.7; border-left:4px solid var(--success)' : ''}">
                    <div>
                        <span class="priority-pill p-${t.priority}">${t.priority}</span>
                        <strong>${t.pharmacy}</strong>
                        <p style="font-size:0.8rem;color:var(--text-muted)">
                            Cod: ${t.clientId} | <span style="color:var(--primary)">Inicio: ${t.createdAt}</span>
                            ${t.completedAt ? ` | <span style="color:var(--success)">Fin: ${t.completedAt}</span>` : ''} 
                        </p>
                        <p style="margin-top:5px">${t.desc}</p>
                    </div>
                    <div style="display:flex;gap:5px;">
                        ${t.status !== 'completada' ? `<button class="btn btn-outline" style="width:40px" onclick="App.updateStatus(${t.id}, 'completada')">✅</button>` : ''}
                        <button class="btn btn-outline" style="width:40px;color:var(--danger)" onclick="App.deleteTask(${t.id})">🗑️</button>
                    </div>
                </div>`).join('');
        },

        async openModal() {
            // Generar fecha actual para el input
            const now = new Date();
            const localISO = new Date(now.getTime() - (now.getTimezoneOffset() * 60000)).toISOString().slice(0, 16);

            const { value: f } = await Swal.fire({
                title: 'Nueva Tarea',
                html: `
                    <div style="text-align:left">
                        <label style="font-size:0.75rem;font-weight:700">CÓDIGO Y FARMACIA</label>
                        <div style="display:flex;gap:5px">
                            <input id="swal-client" class="swal2-input" style="width:30%" placeholder="ID" oninput="App.autoComplete(this.value, 'id')">
                            <input id="swal-pharmacy" class="swal2-input" style="width:70%" placeholder="Nombre" oninput="App.autoComplete(this.value, 'name')">
                        </div>
                        
                        <label style="font-size:0.75rem;font-weight:700;margin-top:10px;display:block">FECHA Y HORA DE INICIO</label>
                        <input type="datetime-local" id="swal-time" class="swal2-input" value="${localISO}">

                        <label style="font-size:0.75rem;font-weight:700;margin-top:10px;display:block">DETALLES</label>
                        <select id="swal-priority" class="swal2-input"><option>Media</option><option>Alta</option><option>Baja</option></select>
                        <textarea id="swal-desc" class="swal2-textarea" placeholder="Descripción del problema..."></textarea>
                    </div>`,
                preConfirm: () => {
                    const timeVal = document.getElementById('swal-time').value;
                    const dateObj = new Date(timeVal);
                    return {
                        clientId: document.getElementById('swal-client').value || 'S/N',
                        pharmacy: document.getElementById('swal-pharmacy').value || 'S/N',
                        customTime: dateObj.toLocaleString('es-AR'), // Guardamos la hora elegida[cite: 2]
                        priority: document.getElementById('swal-priority').value,
                        desc: document.getElementById('swal-desc').value
                    }
                }
            });
            if(f && f.desc) App.addTask(f);
        }
    };
</script>
</body>
</html>
