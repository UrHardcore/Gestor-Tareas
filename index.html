<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaTask Pro | Cloud Edition</title>
    
    <!-- Librerías Externas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- Pantalla de Inicio de Sesión -->
<div id="auth-overlay">
    <div class="auth-card">
        <div class="auth-header">
            <h1>PharmaTask <span>Pro</span></h1>
            <p>Gestión Cloud de Farmacias</p>
        </div>

        <!-- Botón de Google -->
        <button class="google-btn" onclick="AuthUI.loginWithGoogle()">
            <svg width="20" height="20" viewBox="0 0 24 24">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Iniciar sesión con Google
        </button>

        <div class="divider">
            <span>o usar correo</span>
        </div>

        <input type="email" id="login-email" placeholder="Correo electrónico">
        <input type="password" id="login-pass" placeholder="Contraseña">
        <button class="btn btn-primary" onclick="AuthUI.handleLogin()">Entrar / Registrarse</button>
    </div>
</div>

<!-- Aplicación Principal -->
<div class="layout">
    <header class="app-header">
        <div>
            <div class="user-bar">
                <span id="user-display">Cargando...</span> | 
                <a href="#" onclick="AuthUI.logout()">Salir</a>
            </div>
            <h1>PharmaTask <span>Pro</span></h1>
            <p>Panel de Control</p>
        </div>
        <div class="header-actions">
            <button class="btn-icon" onclick="App.toggleTheme()">🌓</button>
            <button class="btn btn-primary" onclick="UI.openModal()">+ Nueva Tarea</button>
        </div>
    </header>

    <div class="stats-grid">
        <div class="stat-card"><h4>Total</h4><p id="stat-total">0</p></div>
        <div class="stat-card"><h4>En Proceso</h4><p id="stat-process" style="color: var(--warning);">0</p></div>
        <div class="stat-card"><h4>Finalizadas</h4><p id="stat-done" style="color: var(--success);">0</p></div>
    </div>

    <main class="control-panel">
        <section>
            <input type="text" id="globalSearch" placeholder="Buscar farmacia o código..." onkeyup="App.filterTasks()">
            <div id="taskListContent"></div>
        </section>

        <aside>
            <div class="card sync-card">
                <h3>Base de Datos Cloud</h3>
                <input type="file" id="excel-upload" accept=".xlsx, .xls, .csv" onchange="App.handleExcel(event)">
                <button class="btn btn-outline" onclick="document.getElementById('excel-upload').click()">📁 Cargar Excel</button>
                <div id="client-status"></div>
            </div>
            <button class="btn btn-primary" onclick="App.exportPDF()">📄 Generar PDF</button>
        </aside>
    </main>
</div>

<!-- Plantilla para PDF (Oculta) -->
<div id="pdf-template" style="display:none; padding: 40px;">
    <h2 style="color: #2563eb; border-bottom: 2px solid #2563eb; padding-bottom: 10px;">Reporte PharmaTask</h2>
    <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
        <thead><tr style="background: #f1f5f9;"><th style="padding:10px; border:1px solid #ddd;">Código</th><th style="padding:10px; border:1px solid #ddd;">Farmacia</th><th style="padding:10px; border:1px solid #ddd;">Descripción</th></tr></thead>
        <tbody id="pdf-body"></tbody>
    </table>
</div>

<!-- Scripts y Estilos se cargan al final -->
</body>
</html>
